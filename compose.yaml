services:
  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    container_name: cloudbox-nginx
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    networks:
      - frontend_net
    volumes:
      - ./docker/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/nginx_health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloudbox-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:5000}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - frontend_net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "wget --spider -q http://127.0.0.1:5173 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudbox-backend
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      - APP_ENV=${APP_ENV:-development}
      - FLASK_ENV=${FLASK_ENV:-development}
      - FLASK_DEBUG=${FLASK_DEBUG:-1}
      - SECRET_KEY=${SECRET_KEY:-cloudbox-dev-secret-key-phase2-active}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-cloudbox-jwt-dev-secret-key-phase2-active}
      - JWT_ACCESS_TOKEN_EXPIRES=${JWT_ACCESS_TOKEN_EXPIRES:-86400}
      - MAX_CONTENT_LENGTH=${MAX_CONTENT_LENGTH:-52428800}
      - BACKEND_PORT=${BACKEND_PORT:-5000}
      - POSTGRES_HOST=${POSTGRES_HOST:-db}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-cloudbox_db}
      - POSTGRES_USER=${POSTGRES_USER:-cloudbox_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password123}
      - MINIO_HOST=${MINIO_HOST:-minio}
      - MINIO_API_PORT=${MINIO_API_PORT:-9000}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-cloudbox_admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-password123}
      - MINIO_SECURE=${MINIO_SECURE:-false}
      - MINIO_DEFAULT_BUCKET=${MINIO_DEFAULT_BUCKET:-cloudbox-uploads}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-password123}
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-password123}@${REDIS_HOST:-redis}:${REDIS_PORT:-6379}/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-password123}@${REDIS_HOST:-redis}:${REDIS_PORT:-6379}/2
    volumes:
      - ./backend:/app
      - ./scripts:/app/scripts:ro
      - ./backups:/app/backups
    networks:
      - frontend_net
      - backend_net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:5000/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudbox-worker
    command: celery -A app.celery_app.celery worker --loglevel=info -c 2
    environment:
      - APP_ENV=${APP_ENV:-development}
      - POSTGRES_HOST=${POSTGRES_HOST:-db}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-cloudbox_db}
      - POSTGRES_USER=${POSTGRES_USER:-cloudbox_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password123}
      - MINIO_HOST=${MINIO_HOST:-minio}
      - MINIO_API_PORT=${MINIO_API_PORT:-9000}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-cloudbox_admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-password123}
      - MINIO_SECURE=${MINIO_SECURE:-false}
      - MINIO_DEFAULT_BUCKET=${MINIO_DEFAULT_BUCKET:-cloudbox-uploads}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-password123}
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-password123}@${REDIS_HOST:-redis}:${REDIS_PORT:-6379}/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@${REDIS_HOST:-redis}:${REDIS_PORT:-6379}/2
    volumes:
      - ./backend:/app
    networks:
      - backend_net
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: cloudbox-redis
    command:
      - redis-server
      - --requirepass
      - "${REDIS_PASSWORD:-password123}"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - "60"
      - "1"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-password123}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend_net
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - 'redis-cli --no-auth-warning -a "$${REDIS_PASSWORD:-password123}" ping | grep -q PONG'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  db:
    image: postgres:16-alpine
    container_name: cloudbox-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cloudbox_db}
      POSTGRES_USER: ${POSTGRES_USER:-cloudbox_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend_net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: cloudbox-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cloudbox_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password123}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    networks:
      - backend_net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/9000' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
  redis_data:
    driver: local
