# ==============================================================================
# CloudBox — Shared Storage & Background Infrastructure Docker Compose
# Runs PostgreSQL, MinIO Object Storage, Redis Message Broker, and Celery Worker
# on the designated Shared Server (or Laptop 1 as the shared host).
#
# Usage:
#   docker compose -f docker-compose.shared.yml up -d
# ==============================================================================

services:
  # ---------------------------------------------------------------------------
  # Shared PostgreSQL Database
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: cloudbox-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cloudbox_db}
      POSTGRES_USER: ${POSTGRES_USER:-cloudbox_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - cloudbox_shared_net
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ---------------------------------------------------------------------------
  # Shared MinIO S3 Object Storage
  # ---------------------------------------------------------------------------
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: cloudbox-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cloudbox_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password123}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    networks:
      - cloudbox_shared_net
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/9000' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ---------------------------------------------------------------------------
  # Shared Redis Cache & Task Broker
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: cloudbox-redis
    command:
      - redis-server
      - --requirepass
      - "${REDIS_PASSWORD:-password123}"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - "60"
      - "1"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-password123}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - cloudbox_shared_net
    restart: always
    healthcheck:
      test:
        - CMD-SHELL
        - 'redis-cli --no-auth-warning -a "$${REDIS_PASSWORD:-password123}" ping | grep -q PONG'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ---------------------------------------------------------------------------
  # Shared Celery Background Worker
  # ---------------------------------------------------------------------------
  worker:
    image: karthik11105/cloudbox-worker:v1.0.1
    container_name: cloudbox-shared-worker
    environment:
      - APP_ENV=${APP_ENV:-production}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-cloudbox_db}
      - POSTGRES_USER=${POSTGRES_USER:-cloudbox_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password123}
      - MINIO_HOST=minio
      - MINIO_API_PORT=${MINIO_API_PORT:-9000}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-cloudbox_admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-password123}
      - MINIO_SECURE=${MINIO_SECURE:-false}
      - MINIO_DEFAULT_BUCKET=${MINIO_DEFAULT_BUCKET:-cloudbox-uploads}
      - REDIS_HOST=redis
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-password123}
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-password123}@redis:${REDIS_PORT:-6379}/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-password123}@redis:${REDIS_PORT:-6379}/2
    networks:
      - cloudbox_shared_net
    restart: always
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy

networks:
  cloudbox_shared_net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
  redis_data:
    driver: local
