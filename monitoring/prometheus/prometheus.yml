# CloudBox Prometheus Monitoring Configuration

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - "/etc/prometheus/alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  - job_name: "cloudbox-backend"
    metrics_path: "/api/metrics/prometheus"
    scrape_interval: 10s
    static_configs:
      - targets: ["backend:5000"]
        labels:
          service: "cloudbox-backend"
          environment: "production"

  - job_name: "cloudbox-node"
    scrape_interval: 15s
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: "host-system"

  - job_name: "cloudbox-cadvisor"
    scrape_interval: 15s
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          service: "container-telemetry"
